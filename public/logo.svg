  <path d="M 256 68 L 138 160 C 132 165 130 172 134 178 C 138 184 146 186 152 181 L 256 100 L 360 181 C 366 186 374 184 378 178 C 382 172 380 165 374 160 Z" fill="#176B4D"/>
  
